# Image Recache (B5.10): every object in media-images that still carries
# cacheControl = no-cache gets the house cache policy, bot/image_cache_policy.py
# — 7 days for a key that names a slot (posters/<id>.jpg, carousels/<id>/<n>.jpg,
# seasons/<id>/<n>.jpg; Fran's number, 22/11), a year for a key that names
# TMDb's file — by uploading its own bytes again under its own key, byte for
# byte. On 22/11, 625,395 objects (≈ 625,000) were on no-cache, which the app's
# image cache reads as zero validity: carousels/ 448,425 (33.2 GB), posters/
# 125,898 (10.6 GB), seasons/ 51,072 (4.7 GB) — 48.5 GB of egress for the whole
# drain, each object downloaded once. The `prefixes` input is how Fran decides
# when the carousels go: a dispatch walks the prefixes it lists, in that order;
# the hourly runs walk the default below, which reaches the carousels after the
# posters and the seasons.
# Every run proves the SERVED header first (supabase/storage #1109: a change of
# the stored value that the public URL never serves): on its first re-upload it
# reads that object's Cache-Control at its public URL every 5 s for up to 90 s,
# and the stored value back, and stops red after that one object unless both
# say the policy's max-age. A cursor in bot_state (image_recache_cursor) carries
# the walk from run to run; each run stops itself at its time budget or
# max_objects, inside the job's 90 minutes, with its SUMMARY and the cursor
# written. The whole drain is ≈ 20 runs of ≈ 27 minutes of Actions; after it, a
# run ends in seconds with drain_done=1 (restart 'true' walks it again). Hourly
# at :53, off the top of the hour and away from Posters HD's :41 and TMDb
# Mirror's 12:23. Needs public.image_cache_page (applied 22/11): without it the
# first call stops the run, saying so. It never writes media and never deletes
# a file; its only secrets are the two Supabase ones, on the step that runs the
# script. It writes no image field TMDb Mirror copies, so it is not in that
# workflow's workflow_run list.
#
# B5.10.1 — the drain relaunches itself. Measured on 26/11: ten scheduled runs
# in 3.7 days against twenty-four windows a day (GitHub fired about three a day,
# 8 to 12 hours apart, and no run was lost in between: the empty hours are runs
# it never started), each 4,000 to 11,600 objects (2.6 to 7.7 a second at 6
# workers; latency-bound) — not B5.10's ≈ 20 runs: ≈ 27 days of drain at that
# pace. So a hop: a run whose budget ends with the drain not done (budget_hit=1
# and drain_done=0, which the script appends to $GITHUB_OUTPUT) dispatches the
# next run itself, with its own knobs, restart 'false' always and chain_left one
# less. A hop does not relaunch when chain_left is not a whole number; when it
# is 0 (the chain is exhausted); when it refused as much as it retagged (a CDN
# or Storage outage must not walk the cursor through 48 hops of refusals); or
# when a run is already waiting in this workflow's queue (one run at a time
# keeps one pending run and cancels the older; the waiting one takes the drain
# with its own knobs and chain_left — a scheduled one with the defaults and 48,
# a dispatch left at '0' for one run). A red hop never relaunches and stays visible.
# A dispatch is one run unless it asks for a chain (chain_left defaults to '0'; a
# box left empty reads as 48, like the schedule); the hourly schedule, which has
# no inputs, chains with 48, so it remains the backstop and the restarter of a
# chain that stopped. drain_done=1 on a list that ends with the cursor's prefix
# (the hourly list ends with carousels/) ends chains for good; a dispatch's
# shorter list ends only its own chain, and the next hourly run walks on. Cost:
# ≈ 27 Actions minutes a hop (1.5 of them setup), ≈ 47 hops and ≈ 1,300 minutes
# for the drain at 12 workers (B5.10.1's default), ≈ 21 hours back to back; on
# a private repository those minutes count against the plan's.
name: Image Recache

on:
  schedule:
    - cron: '53 * * * *'  # hourly at :53 UTC
  workflow_dispatch:
    inputs:
      prefixes:
        description: 'Prefixes to walk, in order (posters/, seasons/, carousels/, posters-hd/, tmdb/)'
        required: false
        default: 'posters/,seasons/,carousels/'
      time_budget_min:
        description: 'Minutes after the start when the run stops itself, with its SUMMARY (at most 80, inside the 90-minute job)'
        required: false
        default: '25'
      max_objects:
        description: 'Max objects to fetch this run (re-uploaded, refused or failed; done rows are free)'
        required: false
        default: '40000'
      workers:
        description: 'Objects fetched and uploaded at once (1-16)'
        required: false
        default: '6'
      restart:
        description: "'true' puts the cursor back at the first prefix (a drain that is done walks again)"
        required: false
        default: 'false'
      chain_left:
        description: "Hops this run may add after itself while its budget ends with the drain not done ('0' = this run only; the hourly runs use 48)"
        required: false
        default: '0'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  image-recache:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Re-cache images
        id: recache
        env:
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IMAGE_RECACHE_PREFIXES: ${{ github.event.inputs.prefixes || 'posters/,seasons/,carousels/' }}
          IMAGE_RECACHE_TIME_BUDGET_MIN: ${{ github.event.inputs.time_budget_min || '25' }}
          IMAGE_RECACHE_MAX_OBJECTS: ${{ github.event.inputs.max_objects || '40000' }}
          IMAGE_RECACHE_WORKERS: ${{ github.event.inputs.workers || '6' }}
          IMAGE_RECACHE_RESTART: ${{ github.event.inputs.restart || 'false' }}
        run: python -m bot.image_recache
      - name: Relaunch while the drain is not done
        if: success() && steps.recache.outputs.budget_hit == '1' && steps.recache.outputs.drain_done == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHAIN_LEFT: ${{ github.event.inputs.chain_left || '48' }}
          PREFIXES: ${{ github.event.inputs.prefixes || 'posters/,seasons/,carousels/' }}
          BUDGET_MIN: ${{ github.event.inputs.time_budget_min || '25' }}
          MAX_OBJECTS: ${{ github.event.inputs.max_objects || '40000' }}
          WORKERS: ${{ github.event.inputs.workers || '6' }}
          RETAGGED: ${{ steps.recache.outputs.retagged }}
          REFUSED: ${{ steps.recache.outputs.refused }}
        run: |
          set -euo pipefail
          if ! [[ "$CHAIN_LEFT" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "[IMAGE_RECACHE] chain_left '$CHAIN_LEFT' is not a whole number; no relaunch"
            exit 0
          fi
          if (( CHAIN_LEFT == 0 )); then
            echo "[IMAGE_RECACHE] chain exhausted; the hourly run takes it from here"
            exit 0
          fi
          if (( RETAGGED <= REFUSED )); then
            echo "[IMAGE_RECACHE] retagged=$RETAGGED refused=$REFUSED: this hop refused as much as it retagged; the hourly run tries again"
            exit 0
          fi
          waiting=$(gh run list --workflow image_recache.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')
          if [ "$waiting" != "0" ]; then
            echo "[IMAGE_RECACHE] $waiting run(s) waiting: a run is already waiting; it takes the drain from here"
            exit 0
          fi
          gh workflow run image_recache.yml --ref "$GITHUB_REF_NAME" -f "prefixes=$PREFIXES" -f "time_budget_min=$BUDGET_MIN" -f "max_objects=$MAX_OBJECTS" -f "workers=$WORKERS" -f restart=false -f "chain_left=$((CHAIN_LEFT - 1))"
          echo "[IMAGE_RECACHE] relaunched: the next hop is dispatched with $((CHAIN_LEFT - 1)) left"
