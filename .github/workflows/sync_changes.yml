name: Sync Changes

on:
  schedule:
    - cron: '0 7 * * *'  # 7am UTC daily, between nightly (6am) and daily verify (8am)
  workflow_dispatch:      # manual trigger for testing

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-changes:
    runs-on: ubuntu-latest
    # 180 to match nightly.yml's Step 10, which does the same per-title
    # appended-detail + provider-sync work over a comparable batch. The
    # existing-title refresh branch adds ~20-30 min at MAX_EXISTING_REFRESH
    # =2000 (Supabase round-trips, not TMDB, are the bottleneck), on top of
    # an uncapped new-candidate loop — 60 was too tight, and a timeout here
    # is self-amplifying: last_synced_at is only persisted after the refresh
    # loop, so a killed run leaves the window unadvanced and the next run's
    # window strictly wider.
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run sync changes
        run: python -m bot.sync_changes
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
