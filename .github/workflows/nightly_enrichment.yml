name: Nightly Enrichment

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max titles to enrich this run'
        required: false
        default: '2000'
  schedule:
    - cron: '0 9 * * *'  # 9AM UTC = 6AM Chile, 3h after main nightly bot

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      # The schedule serves 1,000 titles a night, said here in so many words
      # (Fran, 23/10: the cap is not raised; the server's enrichment_queue
      # decides WHICH thousand). Before B3 the schedule shared the dispatch
      # command below and, having no inputs, fell to its `|| '2000'`.
      - name: Enrich new titles (scheduled, 1,000 a night)
        if: github.event_name == 'schedule'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m bot.enrich_new_titles --limit=1000
      - name: Enrich new titles
        if: github.event_name == 'workflow_dispatch'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m bot.enrich_new_titles --limit=${{ github.event.inputs.limit || '2000' }}
