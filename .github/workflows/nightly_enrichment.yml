name: Nightly Enrichment

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max titles to enrich this run'
        required: false
        default: '2000'
  schedule:
    - cron: '0 9 * * *'  # 9AM UTC = 6AM Chile, 3h after main nightly bot

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Enrich new titles
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m bot.enrich_new_titles --limit=${{ github.event.inputs.limit || '2000' }}
