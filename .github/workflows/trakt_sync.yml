# Daily while the backlog is re-drained; back to Mondays after — decision 1.439.
# On 25/10 the server counted 131,456 titles pending: 78,178 never stamped and
# 53,278 stamped before the fix instant 2026-10-24T16:00:00Z (the bot's
# TRAKT_RELATED_FIX_DATE) — ≈ 44 days at 3,000 a run. Go back by hand once no
# row with tmdb_missing_at IS NULL has trakt_related_synced_at before that
# instant, and change tests/test_workflow_trakt_sync.py, which pins this file,
# in the same commit.
# Each title costs ≈ 1.4 Trakt calls (one by IMDB id when the title has one,
# resolve + /related otherwise) and ONE database write (trakt_replace_related,
# migration 20261025160000). The client pauses before Trakt's own limit
# (X-Ratelimit) instead of running into its 300 s penalty, and the drain stops
# itself at the time budget, 80 minutes, inside the job's 90 — so a run always
# ends with its SUMMARY line.
# 02:17 UTC, off the top of the hour: GitHub documents that :00 schedules are
# the ones delayed, and the 03:00 run of 25/10 started five hours late, on top
# of the other daily jobs.
name: Trakt Sync

on:
  schedule:
    - cron: '17 2 * * *'  # daily 02:17 UTC (~23:17 Chile)
    # - cron: '0 8 * * 1'  # Mondays 08:00 UTC (~05:00 Chile) — back to this after the re-drain
  workflow_dispatch:
    inputs:
      related_batch:
        description: 'Max titles to drain from trakt_related_queue this run (asked in slices of 1,000)'
        required: false
        default: '3000'
      time_budget_min:
        description: 'Minutes after the start when the drain stops itself, with its SUMMARY (inside the 90-minute job)'
        required: false
        default: '80'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  trakt-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Trakt sync
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TRAKT_RELATED_BATCH: ${{ github.event.inputs.related_batch || '3000' }}
          TRAKT_TIME_BUDGET_MIN: ${{ github.event.inputs.time_budget_min || '80' }}
        run: python -m bot.sync_trakt
