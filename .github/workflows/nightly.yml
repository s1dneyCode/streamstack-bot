name: Nightly Bot

on:
  schedule:
    - cron: '0 6 * * *'      # nightly at 06:00 UTC
    # DISABLED 2026-08-05 — monthly cleanup was deleting rows CASCADE-referenced
    # by user data (reviews, watchlists, favorites, etc). Do not re-enable this
    # cron until cleanup_low_quality.py's user-anchored-title guard ships AND
    # is verified. See the `monthly-cleanup` job's `if: false` gate below.
    # - cron: '0 6 1 * *'      # monthly cleanup: 1st of each month at 06:00 UTC (03:00 Chile)
  workflow_dispatch:
  # Push and pull_request run the `tests` job ONLY. Every job that touches
  # production is gated to schedule / workflow_dispatch below, so a push can
  # never start an ingest.
  push:
  pull_request:

concurrency:
  # Ingest runs (schedule / dispatch) share one group so two bots never
  # overlap — exactly as before. Push / PR runs get a group per ref instead:
  # in the bot's group they would wait behind a running ingest, and a newer
  # pending run cancels an older pending one, so a push could cancel a
  # queued nightly.
  group: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && format('tests-{0}', github.ref) || github.workflow }}
  cancel-in-progress: false

jobs:
  tests:
    # Unit tests with fakes: no network, no database, no secrets.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile bot/*.py tests/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t .

  run-bot:
    # Writes to production: never on push / pull_request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m bot.main

  monthly-cleanup:
    runs-on: ubuntu-latest
    # HARD-DISABLED 2026-08-05 — see cron comment above. This job deletes rows
    # that user data (reviews/watchlists/favorites/etc) CASCADE-references.
    # Do not flip this back on without the user-anchored-title guard in
    # cleanup_low_quality.py AND an --apply flag on the run command below.
    if: false
    # Original trigger condition, restore alongside the cron line once fixed:
    # if: github.event_name == 'schedule' && startsWith(github.event.schedule, '0 6 1')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monthly cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        # --apply is required here — without it cleanup_low_quality.py only
        # logs what it would delete and mutates nothing (see script docstring).
        run: python -m bot.cleanup_low_quality --apply
