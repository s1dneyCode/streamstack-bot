# TMDb Mirror (B5.8): every image the app still loads from image.tmdb.org,
# copied once to our own Storage — backdrops at w1280, title logos at w500,
# cast and crew photos at w185 — at media-images/tmdb/{size}/{file}, under
# TMDb's own file name, byte for byte, with a one-year cache (decided 27/10:
# the app reads everything from our side). It reads media and media_credits
# only through its RPCs, writes only its ledger, and never deletes a file.
# Needs migration tmdb_image_mirror (public.tmdb_image_mirror and the RPCs
# tmdb_mirror_titles / tmdb_mirror_missing) applied first: without it the
# script stops at its first call, naming the migration, and uploads nothing.
# When (B5.9): the first copy is complete (28/10: 275,300 files in the ledger,
# 8,012 MB), so it no longer runs hourly. Every run sweeps the catalogue from
# its first page, and a sweep with nothing new still costs ≈ 3,300 calls and
# ≈ 50 MB of database egress (≈ 7 minutes) — hourly, ≈ 37 GB a month to find
# nothing. A new image only comes from a workflow that writes one, so it runs
# through workflow_run after each of them completes (whatever its conclusion:
# a failed run may still leave rows to mirror), each listed by its title — the
# nightly bot (Step 9's logos), the enrichment (logos, cast and crew), and the
# backfill workflows (backdrops, logos, credits); once a day at 12:23 UTC as a
# fallback, off the top of the hour and after the nightly chain (Coverage
# Sweep at 10:00), so a dropped event or a skipped cron costs at most a day;
# and on dispatch. An upstream Nightly Bot run started by a push or a pull
# request only runs its tests, so it starts no sweep. One run at a time, and
# one waiting: a later trigger replaces the waiting one, so the last sweep
# always follows the last writer. A sweep with nothing new ends with copied=0
# in its SUMMARY. A run stops itself at the time budget or the file cap,
# inside the job's 90 minutes, and the next one continues where the ledger
# says; a dispatch may ask up to 80 minutes (and a larger max_files). TMDb's
# image CDN needs no key, so the job's only secrets are the two Supabase ones,
# on the step that runs the script.
name: TMDb Mirror

on:
  workflow_run:
    workflows:
      - Nightly Bot
      - Nightly Enrichment
      - Backfills
      - "Full Backfill — New Data"
      - "Full Backfill — After Bulk Import"
    types: [completed]
  schedule:
    - cron: '23 12 * * *'  # daily 12:23 UTC: the fallback, after the nightly chain
  workflow_dispatch:
    inputs:
      time_budget_min:
        description: 'Minutes after the start when the run stops itself, with its SUMMARY (at most 80, inside the 90-minute job)'
        required: false
        default: '25'
      max_files:
        description: 'Max files to fetch this run (copied, missing or errors)'
        required: false
        default: '20000'
      workers:
        description: 'Files fetched and uploaded at once (1-16)'
        required: false
        default: '6'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tmdb-mirror:
    # After an upstream run only when it ran the bot: Nightly Bot on a push or a pull request runs its tests alone.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Mirror TMDb images
        env:
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_MIRROR_TIME_BUDGET_MIN: ${{ github.event.inputs.time_budget_min || '25' }}
          TMDB_MIRROR_MAX_FILES: ${{ github.event.inputs.max_files || '20000' }}
          TMDB_MIRROR_WORKERS: ${{ github.event.inputs.workers || '6' }}
        run: python -m bot.tmdb_mirror
